name: Build Android APK

# Запуск вручную: Actions → Build Android APK → Run workflow.
# Каждая сборка публикуется как GitHub Release (тег vN), приложение само находит новый релиз.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Что нового (покажется в окне обновления)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Без постоянного ключа каждая сборка подписывается новым случайным ключом,
      # и Android не ставит её поверх старой. Ключ создаётся при первой сборке,
      # шифруется паролем из секрета KEYSTORE_PASS и хранится в репозитории (app/signing).
      - name: Signing key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Не задан секрет KEYSTORE_PASS (см. ANDROID.md, раздел «Обновления приложения»)"
            exit 1
          fi
          mkdir -p ~/.android
          ENC=app/signing/debug.keystore.enc
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEYSTORE_PASS -in "$ENC" -out ~/.android/debug.keystore \
              || { echo "::error::Не удалось расшифровать ключ: неверный пароль в KEYSTORE_PASS"; exit 1; }
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p app/signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEYSTORE_PASS -in ~/.android/debug.keystore -out "$ENC"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Add encrypted signing key"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null

      - name: Build number
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Prepare web files
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node app/prepare.js

      - name: Install Capacitor
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      # Системная заставка Android по умолчанию показывает иконку на фоне, пока грузится сайт.
      # Оставляем только однотонный фон: дальше сразу идёт анимация входа из самого сайта.
      - name: Plain native splash
        run: python3 app/patch-native-splash.py app/android/app/src/main/res/values/styles.xml

      # versionCode должен расти с каждой сборкой, иначе Android не обновит приложение.
      - name: Set version
        working-directory: app/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD}/; s/versionName \"[^\"]*\"/versionName \"1.0.${BUILD}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle
          grep -q "versionCode ${BUILD}" build.gradle

      - name: Generate icons
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets

      # Тематическая иконка Android 13+: система перекрашивает силуэт под обои и тему.
      # Берём прозрачный силуэт (foreground) как монохромный слой адаптивной иконки.
      - name: Themed icon layer
        working-directory: app/android/app/src/main/res
        run: |
          if [ ! -f mipmap-xxxhdpi/ic_launcher_foreground.png ]; then
            echo "::warning::Адаптивная иконка не сгенерирована, тематический слой пропущен"
            exit 0
          fi
          for f in mipmap-anydpi-v26/ic_launcher.xml mipmap-anydpi-v26/ic_launcher_round.xml; do
            [ -f "$f" ] || continue
            grep -q "<monochrome" "$f" || sed -i 's#</adaptive-icon>#    <monochrome android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>#' "$f"
            grep -q "<monochrome" "$f"
            cat "$f"
          done

      - name: Sync web files into Android project
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk raspisanie.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: raspisanie.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD }}
          name: Расписание v${{ env.BUILD }}
          body: ${{ inputs.notes }}
          files: raspisanie.apk
          make_latest: true
