name: Build Android APK

# Запуск вручную: Actions → Build Android APK → Run workflow.
# Каждая сборка публикуется как GitHub Release (тег vN), приложение само находит новый релиз.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Что нового (покажется в окне обновления)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Без постоянного ключа каждая сборка подписывается новым случайным ключом,
      # и Android не ставит её поверх старой. Ключ берём из секрета DEBUG_KEYSTORE_B64.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Не задан секрет DEBUG_KEYSTORE_B64 (см. ANDROID.md, раздел «Обновления приложения»)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build number
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Prepare web files
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node app/prepare.js

      - name: Install Capacitor
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      # versionCode должен расти с каждой сборкой, иначе Android не обновит приложение.
      - name: Set version
        working-directory: app/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD}/; s/versionName \"[^\"]*\"/versionName \"1.0.${BUILD}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle
          grep -q "versionCode ${BUILD}" build.gradle

      - name: Generate icons
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync web files into Android project
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk raspisanie.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: raspisanie.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD }}
          name: Расписание v${{ env.BUILD }}
          body: ${{ inputs.notes }}
          files: raspisanie.apk
          make_latest: true
