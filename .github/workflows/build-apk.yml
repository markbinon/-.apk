name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node app/prepare.js

      - name: Install Capacitor
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Generate icons
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync web files into Android project
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
